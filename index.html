<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0a1016">
  <meta name="color-scheme" content="dark">
  <title>MOB MONSTERS</title>
  <link rel="stylesheet" href="css/style.css?v=002">
  <link rel="stylesheet" href="css/ui_rebuild.css?v=021">
  <link rel="stylesheet" href="css/github_assets.css?v=022">
  <link rel="stylesheet" href="css/production.css?v=024">
  <link rel="stylesheet" href="css/exploration.css?v=027">
  <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-go="home" type="button" aria-label="HOMEへ戻る">
        <img class="brand-logo-v3" src="assets/ui/logo_mob_monsters.svg" alt="MOB MONSTERS" onerror="this.classList.add('failed')">
        <span class="brand-mark brand-fallback-v3" aria-hidden="true"><i></i></span>
        <span class="brand-copy brand-copy-v3"><b>MOB MONSTERS</b><small>SOUL &amp; RECORD RPG</small></span>
      </button>
      <div class="top-resources" aria-label="resources">
        <span class="resource-chip"><small>G</small><b id="topGold">0</b></span>
        <span class="resource-chip soul"><small>SOUL</small><b id="topSoul">0</b></span>
        <button id="systemBtn" class="system-btn-v4" type="button" aria-label="SYSTEM">⚙</button>
      </div>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="bottom-nav" aria-label="main menu">
      <button data-go="home" type="button"><i class="nav-glyph nav-home" aria-hidden="true"></i><span>HOME</span></button>
      <button data-go="party" type="button"><i class="nav-glyph nav-party" aria-hidden="true"></i><span>パーティー編成</span></button>
      <button data-go="settings" type="button"><i class="nav-glyph" aria-hidden="true">⚙</i><span>設定</span></button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><b id="modalTitle">MENU</b><button id="modalClose" type="button" aria-label="閉じる">×</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <div id="assetLoading" class="asset-loading" hidden>
    <section class="loading-card" aria-label="画像の読み込み">
      <span class="loading-crest" aria-hidden="true">✦</span>
      <small>MOB MONSTERS</small><h2>冒険の準備中</h2>
      <p id="loadingStatus" role="status" aria-live="polite">仲間たちを呼んでいます…</p>
      <progress id="loadingProgress" max="1" value="0" aria-label="画像読み込み進捗"></progress>
      <button id="loadingSkip" class="ghost-btn" hidden>先に進む</button>
    </section>
  </div>

  <script src="js/assets.js?v=024"></script>
  <script src="js/asset_map.js?v=022"></script>
  <script src="js/data.js?v=022"></script>
  <script src="js/ui_assets.js?v=026"></script>
  <script src="js/loading.js?v=024"></script>
  <script src="js/game_input.js?v=027"></script>
  <script src="js/exploration.js?v=027"></script>
  <script src="js/game.js?v=027"></script>
</body>
</html>
