<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#17120d">
  <title>MOB MONSTERS</title>
  <link rel="stylesheet" href="css/style.css?v=001">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-go="home" type="button">
        <b>MOB MONSTERS</b><small>SOUL & RECORD RPG</small>
      </button>
      <div class="top-resources">
        <span><small>G</small><b id="topGold">0</b></span>
        <span><small>SOUL</small><b id="topSoul">0</b></span>
      </div>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="bottom-nav" aria-label="main menu">
      <button data-go="home" type="button"><i>⌂</i><span>HOME</span></button>
      <button data-go="story" type="button"><i>◇</i><span>STORY</span></button>
      <button data-go="party" type="button"><i>♟</i><span>PARTY</span></button>
      <button data-go="soul" type="button"><i>◎</i><span>SOUL</span></button>
      <button data-go="arena" type="button"><i>♜</i><span>ARENA</span></button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-head"><b id="modalTitle">MENU</b><button id="modalClose" type="button">×</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="js/data.js?v=001"></script>
  <script src="js/game.js?v=001"></script>
</body>
</html>
